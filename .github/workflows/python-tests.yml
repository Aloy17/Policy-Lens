name: Python test suite

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "ingest.py"
      - "audit_chroma.py"
      - "eval/**"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "ingest.py"
      - "audit_chroma.py"
      - "eval/**"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Tesseract for scanned-page validation
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Run selected-page extraction fidelity checks
        run: PYTHONPATH=. python eval/extraction_fidelity.py --pdf-dir data/pdfs --output /tmp/extraction_fidelity_report.json
      - name: Run OCR accuracy against committed references
        run: PYTHONPATH=. python eval/ocr_accuracy.py --reference-dir eval/ocr_reference --pdf-dir data/pdfs --output /tmp/ocr_accuracy.csv
